<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Water Tracker app icon: Bubbles the cat floating in the bottle -->
  <defs>
    <clipPath id="clip">
      <path d="M82 48 L82 62 C82 74 74 80 63 88 C40 104 34 120 34 142
        L34 200 C34 210 39 214 39 222 C39 230 34 234 34 244
        L34 272 C34 294 48 304 68 306 L152 306 C172 304 186 294 186 272
        L186 244 C186 234 181 230 181 222 C181 214 186 210 186 200
        L186 142 C186 120 180 104 157 88 C146 80 138 74 138 62 L138 48 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#CFEFF9"/>
  <g transform="translate(248,100) scale(2.4)">
    <!-- bottle body -->
    <path d="M82 48 L82 62 C82 74 74 80 63 88 C40 104 34 120 34 142
      L34 200 C34 210 39 214 39 222 C39 230 34 234 34 244
      L34 272 C34 294 48 304 68 306 L152 306 C172 304 186 294 186 272
      L186 244 C186 234 181 230 181 222 C181 214 186 210 186 200
      L186 142 C186 120 180 104 157 88 C146 80 138 74 138 62 L138 48 Z"
      fill="#FFFFFF"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="180" width="220" height="180" fill="#55A8F2"/>
      <circle cx="62" cy="226" r="4" fill="#fff" opacity=".4"/>
      <circle cx="150" cy="258" r="5" fill="#fff" opacity=".35"/>
      <circle cx="84" cy="286" r="3.4" fill="#fff" opacity=".3"/>
      <!-- surface line (behind the cat, like the sticker reference) -->
      <ellipse cx="110" cy="180" rx="80" ry="11" fill="#8FCBF8" stroke="#1F1B16" stroke-width="3"/>
      <!-- legs under water -->
      <path d="M92 206 q0 14 8 16 M128 206 q0 14 -8 16" stroke="#1F1B16" stroke-width="7" stroke-linecap="round" fill="none" opacity=".85"/>
      <path d="M92 206 q0 14 8 16 M128 206 q0 14 -8 16" stroke="#F6C583" stroke-width="3.6" stroke-linecap="round" fill="none" opacity=".85"/>
      <!-- ears -->
      <path d="M85 154 L88 136 L102 148z" fill="#F6C583" stroke="#1F1B16" stroke-width="3" stroke-linejoin="round"/>
      <path d="M135 154 L132 136 L118 148z" fill="#F6C583" stroke="#1F1B16" stroke-width="3" stroke-linejoin="round"/>
      <!-- head -->
      <rect x="80" y="146" width="60" height="44" rx="20" fill="#F6C583" stroke="#1F1B16" stroke-width="3.4"/>
      <path d="M104 147 v7 M110 146 v9 M116 147 v7" stroke="#DBA55E" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="96.5" cy="165" r="3" fill="#1F1B16"/>
      <circle cx="123.5" cy="165" r="3" fill="#1F1B16"/>
      <path d="M107 174 Q110 176 113 174" stroke="#1F1B16" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- paws over the surface -->
      <rect x="83" y="182" width="15" height="9" rx="4.5" fill="#F6C583" stroke="#1F1B16" stroke-width="2.6"/>
      <rect x="122" y="182" width="15" height="9" rx="4.5" fill="#F6C583" stroke="#1F1B16" stroke-width="2.6"/>
    </g>
    <!-- bottle outline, lip, cap -->
    <path d="M82 48 L82 62 C82 74 74 80 63 88 C40 104 34 120 34 142
      L34 200 C34 210 39 214 39 222 C39 230 34 234 34 244
      L34 272 C34 294 48 304 68 306 L152 306 C172 304 186 294 186 272
      L186 244 C186 234 181 230 181 222 C181 214 186 210 186 200
      L186 142 C186 120 180 104 157 88 C146 80 138 74 138 62 L138 48 Z"
      fill="none" stroke="#1F1B16" stroke-width="7" stroke-linejoin="round"/>
    <rect x="74" y="38" width="72" height="11" rx="5.5" fill="#fff" stroke="#1F1B16" stroke-width="5"/>
    <rect x="68" y="6" width="84" height="34" rx="10" fill="#5BD1DB" stroke="#1F1B16" stroke-width="6"/>
    <path d="M84 13 v20 M97 13 v20 M110 13 v20 M123 13 v20 M136 13 v20"
      stroke="#1F1B16" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
