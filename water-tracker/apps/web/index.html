<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Tracker</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
      display: grid; place-items: center; text-align: center; padding: 24px;
      background: linear-gradient(180deg, #0B1B33, #050B18); color: #EAF6FF;
    }
    .card {
      max-width: 28rem; padding: 2rem; border-radius: 26px;
      background: rgba(120,190,255,.08); border: 1px solid rgba(120,190,255,.22);
      box-shadow: 0 0 60px rgba(57,214,255,.15);
    }
    h1 { font-size: 2rem; letter-spacing: .02em; }
    .emoji { font-size: 4rem; filter: drop-shadow(0 0 18px rgba(57,214,255,.6));
             animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .code { font-family: ui-monospace, monospace; background: rgba(57,214,255,.14);
            color: #39D6FF; padding: .2em .5em; border-radius: 8px; }
    a.btn {
      display: inline-block; margin: .5rem; padding: .8em 1.5em; border-radius: 999px;
      background: linear-gradient(120deg, #2F80ED, #39D6FF); color: white;
      text-decoration: none; font-weight: 700;
      box-shadow: 0 0 24px rgba(57,214,255,.45);
      transition: transform .15s ease;
    }
    a.btn:hover { transform: scale(1.05); }
    p.small { opacity: .6; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">💧</div>
    <h1 id="headline">Water Tracker</h1>
    <p id="message">Scan the sticker on your bottle. Every refill, logged automatically.</p>
    <div>
      <a class="btn" id="ios" href="#">App Store</a>
      <a class="btn" id="android" href="#">Google Play</a>
    </div>
    <p class="small" id="hint"></p>
  </div>
  <script>
    // If the app is installed, the OS opens it directly via Universal/App
    // Links and this page is never shown. Landing here means: not installed.
    const m = location.pathname.match(/^\/t\/([a-z0-9]+)/i);
    if (m) {
      document.getElementById("headline").textContent = "You scanned a bottle!";
      document.getElementById("message").innerHTML =
        'This sticker (code <span class="code">' + m[1] + '</span>) logs water ' +
        "to the Water Tracker app. Install it, scan again, and the bottle links " +
        "to <em>your</em> account.";
      document.getElementById("hint").textContent =
        "Sharing a bottle with a friend? Same sticker, separate accounts — " +
        "each phone logs to its own profile.";
    }
    // TODO: set real store URLs once published.
  </script>
</body>
</html>
